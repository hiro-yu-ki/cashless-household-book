<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e"><meta name="description" content="決済を自動記帳し、使うほど学習するローカルファースト家計簿">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css">
  <title>さっと家計簿</title>
</head>
<body>
  <header><div><small id="connection">● オフライン対応</small><h1>さっと家計簿</h1></div><button class="icon-button" id="install" hidden>ホームに追加</button></header>
  <main id="app" aria-live="polite"></main>
  <nav aria-label="メインメニュー">
    <button data-route="dashboard">⌂<span>ホーム</span></button><button data-route="calendar">▦<span>カレンダー</span></button>
    <button class="add" data-route="entry" aria-label="取引を追加">＋</button><button data-route="inbox">✓<span>未確認</span><b id="inbox-count"></b></button><button data-route="more">•••<span>その他</span></button>
  </nav>
  <div id="toast" role="status"></div><script type="module" src="/app.js"></script>
</body></html>
